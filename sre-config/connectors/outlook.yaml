# Outlook Connector — ARM connector format
# Enables SendOutlookEmail tool for agents to deliver analysis results via email.
# Must be authorized in the SRE Agent portal after creation (OAuth consent flow).
# Reference: PUT {agentResourceId}/connectors/outlook?api-version=2025-05-01-preview
api_version: azuresre.ai/v2
kind: DataConnector
spec:
  name: outlook
  dataConnectorType: Outlook
  dataSource: outlook
